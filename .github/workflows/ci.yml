name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check src app tests scripts

      - name: Test (pytest, including E2E)
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t predictive-maintenance-studio:ci .

  platform-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: predictive_maintenance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d predictive_maintenance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PMS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/predictive_maintenance_test
      PMS_PLATFORM_CORE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/predictive_maintenance_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Platform Core migrations on PostgreSQL
        run: alembic upgrade head

      - name: Test Platform Core and Industrial Ingestion against PostgreSQL
        run: pytest tests/test_platform_core.py tests/test_industrial_ingestion.py -v

      - name: Recreate PostgreSQL schema for bootstrap
        run: alembic upgrade head

      - name: Bootstrap IMS registry on PostgreSQL
        run: python scripts/bootstrap_platform.py
