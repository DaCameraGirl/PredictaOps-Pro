<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PredictaOps Pro conveyor monitoring hero</title>
  <desc id="desc">Dark industrial conveyor scene with live machine-health monitors and one pulsing degradation alert before a production line stoppage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243a"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M0 390 C240 345 420 430 640 376 S1000 348 1200 398 L1200 520 L0 520 Z" fill="#091220" opacity="0.85"/>
  <g opacity="0.18" stroke="#60a5fa" stroke-width="1">
    <path d="M0 90H1200M0 170H1200M0 250H1200M0 330H1200"/>
    <path d="M120 0V520M320 0V520M520 0V520M720 0V520M920 0V520M1120 0V520"/>
  </g>

  <text x="58" y="72" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="1">PREDICTAOPS PRO</text>
  <text x="58" y="112" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Know what’s breaking before it breaks.</text>

  <g transform="translate(58 146)">
    <rect width="690" height="92" rx="18" fill="url(#panel)" stroke="#223554"/>
    <circle cx="36" cy="32" r="8" fill="#34d399" filter="url(#glowGreen)"/>
    <text x="58" y="39" fill="#d1fae5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">LINE MONITORING ACTIVE</text>
    <text x="24" y="70" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Vibration → degradation evidence → RUL support → maintenance action</text>
  </g>

  <g transform="translate(790 52)">
    <rect width="352" height="222" rx="22" fill="#190f0b" stroke="#f59e0b" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <circle cx="42" cy="42" r="11" fill="#f59e0b" filter="url(#glowAmber)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="49" fill="#fbbf24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">EARLY WARNING</text>
    <text x="28" y="88" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">Conveyor Drive 04</text>
    <text x="28" y="122" fill="#fdba74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Bearing degradation accelerating</text>
    <rect x="28" y="146" width="296" height="10" rx="5" fill="#3f2813"/>
    <rect x="28" y="146" width="212" height="10" rx="5" fill="#f59e0b">
      <animate attributeName="width" values="178;236;212;178" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="28" y="190" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Action: inspect &amp; schedule intervention</text>
    <text x="28" y="213" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">before an unplanned line stop</text>
  </g>

  <g transform="translate(54 286)">
    <rect x="0" y="44" width="1090" height="100" rx="22" fill="url(#belt)" stroke="#475569"/>
    <rect x="14" y="62" width="1062" height="56" rx="18" fill="#0f172a" stroke="#64748b"/>
    <g fill="#94a3b8">
      <circle cx="70" cy="92" r="22"/><circle cx="190" cy="92" r="22"/><circle cx="310" cy="92" r="22"/>
      <circle cx="430" cy="92" r="22"/><circle cx="550" cy="92" r="22"/><circle cx="670" cy="92" r="22"/>
      <circle cx="790" cy="92" r="22"/><circle cx="910" cy="92" r="22"/><circle cx="1030" cy="92" r="22"/>
    </g>
    <g fill="#1e293b">
      <circle cx="70" cy="92" r="14"/><circle cx="190" cy="92" r="14"/><circle cx="310" cy="92" r="14"/>
      <circle cx="430" cy="92" r="14"/><circle cx="550" cy="92" r="14"/><circle cx="670" cy="92" r="14"/>
      <circle cx="790" cy="92" r="14"/><circle cx="910" cy="92" r="14"/><circle cx="1030" cy="92" r="14"/>
    </g>

    <g transform="translate(80 0)">
      <rect width="92" height="54" rx="8" fill="#2563eb" stroke="#60a5fa"/>
      <path d="M18 18H74M18 30H63" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" from="80 0" to="850 0" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(440 0)">
      <rect width="92" height="54" rx="8" fill="#0f766e" stroke="#5eead4"/>
      <path d="M18 18H74M18 30H63" stroke="#99f6e4" stroke-width="5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" from="440 0" to="980 0" dur="7s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(118 158)">
      <rect width="190" height="70" rx="14" fill="#10231f" stroke="#34d399"/>
      <circle cx="24" cy="25" r="7" fill="#34d399"/>
      <text x="42" y="31" fill="#d1fae5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">DRIVE 01 · HEALTHY</text>
      <text x="20" y="53" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">signal within baseline</text>
    </g>
    <g transform="translate(340 158)">
      <rect width="190" height="70" rx="14" fill="#10231f" stroke="#34d399"/>
      <circle cx="24" cy="25" r="7" fill="#34d399"/>
      <text x="42" y="31" fill="#d1fae5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">DRIVE 02 · HEALTHY</text>
      <text x="20" y="53" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">signal within baseline</text>
    </g>
    <g transform="translate(562 158)">
      <rect width="190" height="70" rx="14" fill="#2b1b0b" stroke="#f59e0b" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <circle cx="24" cy="25" r="7" fill="#f59e0b"><animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/></circle>
      <text x="42" y="31" fill="#fde68a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">DRIVE 04 · WARNING</text>
      <text x="20" y="53" fill="#fdba74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">degradation trend rising</text>
    </g>
    <g transform="translate(784 158)">
      <rect width="250" height="70" rx="14" fill="#111d30" stroke="#60a5fa"/>
      <text x="20" y="28" fill="#bfdbfe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">KEEP THE SHIFT MOVING</text>
      <text x="20" y="51" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">plan maintenance before stoppage</text>
    </g>
  </g>
</svg>